name = "RequestProject"
defaultTargets = [
  "InverseGalois",
  "Mathieu",
  "MathieuRigidity",
  "MathieuRigidityM22",
  "MathieuRigidityM24",
  "PGL2Large",
]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

[[lean_lib]]
name = "InverseGalois"
roots = ["InverseGalois"]
leanOptions = { linter.style.multiGoal = true }

# The Mathieu groups: a self-contained library, developed independently of the inverse Galois
# material and depending only on Mathlib.  Kept as its own `lean_lib` so that its own style
# conventions (in particular `import Mathlib`) stay out of `InverseGalois`.
#
# The target is the root module alone, so the library consists of exactly what `Mathieu.lean`
# imports.  `Mathieu/M11CosetAction.lean` sits outside that closure: its twelve-point coset
# action needs a kernel search over all of `SL(2, ZMod 11)` that costs more memory than the
# build machine has, and nothing in this repository uses it.
[[lean_lib]]
name = "Mathieu"
globs = ["Mathieu"]

# The rigidity certificates for `M₁₁`, `M₁₂` and `M₂₄`.  They are the only place where the
# inverse Galois material meets the `Mathieu` library, so they get their own target rather than
# being pulled into the `InverseGalois` root.
[[lean_lib]]
name = "MathieuRigidity"
roots = [
  "InverseGalois.Rigidity.Examples.MathieuM11",
  "InverseGalois.Rigidity.Examples.MathieuM12",
  "InverseGalois.Rigidity.Examples.MathieuM24Class",
]

# The rigidity certificate for `Aut(M₂₂) = M₂₂ : 2`.  Like the `M₂₄` target below it raises the
# elaboration-thread stack, because the words in the two generators that witness rationality make
# the kernel evaluate long products of permutations of `Fin 23`.
[[lean_lib]]
name = "MathieuRigidityM22"
roots = [
  "InverseGalois.Rigidity.Examples.MathieuM22",
  "InverseGalois.Rigidity.Examples.MathieuM22Index",
]
moreLeanArgs = ["--tstack=262144"]

# The `M₂₄` certificate proper.  It gets a target of its own only to raise the elaboration-thread
# stack: expressing the two standard generators as words in the rigid pair makes the kernel
# evaluate products of more than two hundred permutations of `Fin 24`, which nests more deeply
# than the default stack allows.
[[lean_lib]]
name = "MathieuRigidityM24"
roots = ["InverseGalois.Rigidity.Examples.MathieuM24"]
moreLeanArgs = ["--tstack=262144"]

# The `PGL₂(𝔽ₚ)` certificates for the three largest primes reached, `p = 29, 31, 37`.  Like the
# two Mathieu targets above they get a target of their own only to raise the elaboration-thread
# stack: the kernel checks rationality and the rigidity fibre by multiplying base-`(p+1)` numerals
# encoding permutations of `ℙ¹(𝔽ₚ)`, and at these class sizes the recursion nests more deeply than
# the default stack allows.  They are also the slowest files in the repository.
[[lean_lib]]
name = "PGL2Large"
roots = [
  "InverseGalois.Rigidity.Examples.PGL2F29",
  "InverseGalois.Rigidity.Examples.PGL2F31",
  "InverseGalois.Rigidity.Examples.PGL2F37",
]
moreLeanArgs = ["--tstack=262144"]

# The leanprover/comparator challenge for the Riemann Existence Theorem; see
# extras/comparator/README.md.  Deliberately not a default target: `Challenge` carries the
# `sorry` that `Solution` discharges.
[[lean_lib]]
name = "Challenge"
srcDir = "extras/comparator"

[[lean_lib]]
name = "Solution"
srcDir = "extras/comparator"
